# 每月自动抓取西雅图活动数据并提交 web/data.json（仓库需推到 GitHub）。
# 也可在 Actions 里手动运行：「Run workflow」。
#
# 若只在本地定时跑，不依赖本文件；请用 scripts/run_fetch.sh + cron 或 launchd。
name: Monthly fetch activities

on:
  schedule:
    # 每月 1 日 14:15 UTC（约美西 06:15 / 夏令时 07:15）；可按需改 crontab。
    - cron: "15 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from Seattle Active Communities
        run: python3 fetch_seattle_activities.py --quiet

      - name: Commit and push if data changed
        run: |
          set -e
          if git diff --quiet -- web/data.json; then
            echo "No changes to web/data.json; skipping commit."
            exit 0
          fi
          git add web/data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh activities data (automated monthly)" \
            -m "Generated by .github/workflows/monthly-fetch.yml"
          git push
